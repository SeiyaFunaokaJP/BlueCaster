[package]
name = "bluecaster-ui"
description = "bluecaster.exe: the window process (main window and tray flyout, GPUI), a client of bluecaster-core.exe over the user's Named Pipe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bluecaster"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
ipc.workspace = true
win-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui-kit = { version = "0.11", default-features = false, features = ["component", "assets"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
tracing.workspace = true
ui-model.workspace = true
ui-host.workspace = true
raw-window-handle = "0.6"
windows-version = "0.1"

[dev-dependencies]
# Headless windows driven by pointer, keyboard and wheel input (src/testing.rs)
gpui-kit = { version = "0.11", default-features = false, features = ["component", "assets", "test-support"] }

[lints]
workspace = true
