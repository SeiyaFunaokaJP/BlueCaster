[package]
name = "sign-update"
description = "Signs the installer for the in-app update (Tauri's updater signature, without the Tauri CLI) and checks such a signature as bluecaster.exe does"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The check bluecaster.exe runs (update::verify_signature), so that the tool
# and the app cannot drift apart
ui-host.workspace = true
# The crate the Tauri CLI signs with (tauri-cli 2.12: minisign 0.9)
minisign = "0.9"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
